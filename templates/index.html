<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPA Emission Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1f8ef1, #6a11cb);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .form-container {
    background: rgba(255, 255, 255, 0.15);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    width: 350px;
    animation: fadeIn 1s ease-in-out;
  }

  .form-container h1 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
  }

  label {
    font-size: 0.9rem;
    display: block;
    margin-bottom: 5px;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-bottom: 20px;
    outline: none;
    transition: all 0.3s ease;
  }

  input[type="text"]:focus,
  input[type="number"]:focus {
    transform: scale(1.05);
    background-color: #f9f9f9;
  }

  input[type="submit"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(45deg, #ff6ec4, #7873f5);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  input[type="submit"]:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.4);
  }

  .prediction-box {
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    text-align: center;
    font-size: 1.2rem;
    color: #fff;
    animation: slideUp 1s ease-in-out;
  }

  .floating-bg {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2), transparent 70%);
    animation: float 6s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>
  <div class="floating-bg" style="top:10%; left:10%;"></div>
  <div class="floating-bg" style="bottom:15%; right:10%; animation-delay:2s;"></div>

  <div class="form-container">
    <h1>🌍 Emission Predictor</h1>
    <form method="POST" action="/">
      <label for="state">State:</label>
      <input type="text" id="state" name="state" value="{{ state_val }}" placeholder="e.g. CA" required>

      <label for="sector">Industry Sector:</label>
      <input type="text" id="sector" name="sector" value="{{ sector_val }}" placeholder="e.g. Power Plants" required>

      <label for="year">Reporting Year:</label>
      <input type="number" id="year" name="year" value="{{ year_val }}" placeholder="e.g. 2023" required>

      <input type="submit" value="🚀 Predict Emissions">
    </form>

    {% if prediction %}
      <div class="prediction-box">
        <strong>Prediction:</strong><br>{{ prediction }}
      </div>
    {% endif %}
  </div>
</body>
</html>
